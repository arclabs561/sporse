name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -Dwarnings
      - name: Build
        run: cargo build --all-features
      - name: Test
        run: cargo test --all-features
      - name: Run example assertions
        run: |
          cargo run --example wand_diagnostics
          cargo run --example serde_roundtrip --features serde
          cargo run --example hybrid_retrieval
          cargo run --example ccsa_retrieval
      - name: CLI smoke
        run: |
          printf '{"id":0,"vec":[[0,1.0],[3,2.5]]}\n{"id":1,"vec":[[3,1.0]]}\n' > /tmp/d.jsonl
          cargo run --features cli --bin sporse -- build /tmp/d.jsonl -o /tmp/i.json
          out=$(cargo run --features cli --bin sporse -- search /tmp/i.json --query '[[0,1.0],[3,1.0]]' -k 2)
          echo "$out"
          echo "$out" | head -1 | grep -q '^0' || { echo "FAIL: doc 0 should rank first"; exit 1; }
      - name: Doc
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.80.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check MSRV
        run: |
          rm -f Cargo.lock
          cargo check
  semver:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked || true
      - name: Check semver
        run: cargo semver-checks check-release
