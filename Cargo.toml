[package]
name = "sporse"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
description = "Sparse vector index for learned sparse retrieval"
repository = "https://github.com/arclabs561/sporse"
homepage = "https://github.com/arclabs561/sporse"
documentation = "https://docs.rs/sporse"
keywords = ["sparse", "retrieval", "splade", "search", "ann"]
categories = ["algorithms", "data-structures"]

[workspace]

[features]
default = []
serde = ["dep:serde"]
# `cli` builds the `sporse` binary (build + query an index from files).
cli = ["serde", "dep:clap", "dep:serde_json"]
# `store` adds an updatable, durable index (`store::UpdatableIndex`) backed by
# segstore: incremental add/delete + write-ahead log + checkpoint + compaction.
store = ["serde", "dep:segstore", "dep:durability", "dep:postcard"]
# Compatibility feature retained for crates that enabled the former optional
# `innr` integration. The integration no longer needs an extra dependency.
innr = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
segstore = { version = "0.5", optional = true }
durability = { version = "0.7.1", optional = true }
postcard = { version = "1.0", optional = true, features = ["use-crc", "alloc", "use-std"] }

[[bin]]
name = "sporse"
required-features = ["cli"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
postings = { version = "0.4", features = ["raw-segment"] }
serde_json = "1"
vicinity = { version = "0.10", default-features = false, features = ["hnsw"] }
rankops = "0.1.10"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "store"
harness = false

[[example]]
name = "hybrid_retrieval"

[[example]]
name = "serde_roundtrip"
required-features = ["serde"]

[[example]]
name = "store_reopen_diagnostics"
required-features = ["store"]
